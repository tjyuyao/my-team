[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-team"
version = "0.3.0"
description = "Multi-Agent collaboration platform with hierarchical delegation and async email"
readme = "SPEC.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
