name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quick:
    # 快速门禁（PR 反馈）：单元层 + 静态检查，单版本跑一次。
    # 集成层/全量见 test job（发布门槛）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: R2 (kanban_lint) needs git commit dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests (tests/ root; integration excluded)
        run: uv run pytest tests/ --ignore=tests/integration -q --tb=short

      - name: Run ruff
        run: uv run ruff check src tests

      - name: Run mypy
        run: uv run mypy src/my_team

  test:
    # 全量矩阵（单元 + 集成 + coverage）：发布前门槛。
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: R2 (kanban_lint) needs git commit dates

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run full test suite (unit + integration)
        run: uv run pytest tests/ -v --tb=short

      - name: Run coverage
        run: uv run pytest tests/ --cov=src/my_team --cov-report=term-missing
