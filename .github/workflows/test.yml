name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quick:
    # 快层门禁（PR 反馈）：T1 逻辑层 + 静态检查，亚秒级，单版本跑一次。
    # T1 = 进程内/内核态直调（无 spawn、无 bwrap）；集成层显式 -m integration。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: R2 (kanban_lint) needs git commit dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run T1 fast-tier tests (integration excluded)
        run: uv run pytest tests/ -m "not integration" -q --tb=short

      - name: Run ruff
        run: uv run ruff check src tests

      - name: Run mypy
        run: uv run mypy src/my_team

  test:
    # 全量矩阵（T1 + T2 集成 + coverage）：发布前门槛。T2 真实 spawn+bwrap，
    # 有界但不快；快层门禁见 quick job。
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: R2 (kanban_lint) needs git commit dates

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run T1 fast-tier tests
        run: uv run pytest tests/ -m "not integration" -q --tb=short

      - name: Run T2 integration tests (real spawn + sandbox)
        run: uv run pytest tests/ -m integration -v --tb=short

      - name: Run coverage (T1 fast tier)
        run: uv run pytest tests/ -m "not integration" --cov=src/my_team --cov-report=term-missing
